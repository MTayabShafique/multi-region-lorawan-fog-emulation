global
    log stdout format raw daemon info
    maxconn 100000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 600s
    timeout server 600s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend mqtt_tls
    bind *:8883
    default_backend emqx_mqtt

backend emqx_mqtt
    balance leastconn
    option tcp-check
    server emqx1 fog-emqx1:8883 check resolvers docker init-addr none
    server emqx2 fog-emqx2:8883 check resolvers docker init-addr none
    server emqx3 fog-emqx3:8883 check resolvers docker init-addr none

frontend dashboard
    bind *:18083
    default_backend emqx_dashboard

backend emqx_dashboard
    balance roundrobin
    option tcp-check
    server emqx1 fog-emqx1:18083 check resolvers docker init-addr none
    server emqx2 fog-emqx2:18083 check resolvers docker init-addr none
    server emqx3 fog-emqx3:18083 check resolvers docker init-addr none
