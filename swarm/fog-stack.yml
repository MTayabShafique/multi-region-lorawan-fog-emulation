  fog-emqx1:
    image: emqx:5.0
    hostname: fog-emqx1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export EMQX_NODE__COOKIE="$$(cat /run/secrets/emqx_cookie)";
        exec /usr/bin/docker-entrypoint.sh /opt/emqx/bin/emqx foreground
    environment:
      <<: *emqx-environment
      EMQX_NODE__NAME: emqx@fog-emqx1
    secrets:
      - source: fog_emqx_cookie
        target: emqx_cookie
      - source: fog_mqtt_ca
        target: /opt/emqx/etc/certs/ca.crt
      - source: fog_server_mqtt_cert
        target: /opt/emqx/etc/certs/server.crt
      - source: fog_server_mqtt_key
        target: /opt/emqx/etc/certs/server.key
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    configs:
      - source: fog_emqx_config
        target: /opt/emqx/etc/emqx.conf
      - source: fog_emqx_acl
        target: /opt/emqx/etc/acl.conf
    volumes:
      - fog_emqx1_data:/opt/emqx/data
    networks:
      sensiot_edge:
        aliases:
          - fog-emqx1
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 10s
      timeout: 25s
      retries: 5
      start_period: 30s
    deploy:
      <<: *emqx-deploy
      placement:
        constraints:
          - node.labels.sensiot_emqx_slot == 1
      endpoint_mode: dnsrr

