version: "3.8"

x-worker-deploy: &worker-deploy
  mode: replicated
  replicas: 2
  placement:
    constraints:
      - node.platform.os == linux
    preferences:
      - spread: node.hostname
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 5
    window: 60s
  update_config:
    parallelism: 1
    delay: 10s
    monitor: 30s
    failure_action: rollback
    order: start-first
  rollback_config:
    parallelism: 1
    monitor: 30s
    order: stop-first
  resources:
    reservations:
      cpus: "0.10"
      memory: 96M
    limits:
      cpus: "1.00"
      memory: 384M

x-emqx-deploy: &emqx-deploy
  mode: replicated
  replicas: 1
  restart_policy:
    condition: any
    delay: 10s
    window: 120s
  update_config:
    parallelism: 1
    monitor: 60s
    failure_action: rollback
    order: stop-first
  resources:
    reservations:
      memory: 512M
    limits:
      cpus: "2.00"
      memory: 2G

x-emqx-environment: &emqx-environment
  EMQX_CLUSTER__DISCOVERY_STRATEGY: static
  EMQX_CLUSTER__STATIC__SEEDS: emqx@fog-emqx1,emqx@fog-emqx2,emqx@fog-emqx3
  EMQX_ALLOW_ANONYMOUS: "false"

services:
  fog-node-eu868:
    image: ${FOG_IMAGE:-sensiot/fog-node:latest}
    environment:
      REGION: eu868
      MQTT_BROKER: fog-haproxy
      MQTT_PORT: "8883"
      MQTT_USERNAME: fog-eu868
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
      MQTT_TLS_ENABLED: "true"
      MQTT_TLS_CA: /run/secrets/mqtt_ca
      MQTT_TLS_CERT: /run/secrets/mqtt_cert
      MQTT_TLS_KEY: /run/secrets/mqtt_key
      REDIS_SENTINELS: fog-sentinel1:26379,fog-sentinel2:26379,fog-sentinel3:26379
      REDIS_MASTER_NAME: sensiot-fog
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      CENTRAL_TOPIC: central/data
      AGGREGATION_INTERVAL: "300"
    secrets:
      - source: fog_eu868_mqtt_password
        target: mqtt_password
      - source: fog_redis_password
        target: redis_password
      - source: fog_mqtt_ca
        target: mqtt_ca
      - source: fog_workers_mqtt_cert
        target: mqtt_cert
      - source: fog_workers_mqtt_key
        target: mqtt_key
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      sensiot_edge:
        aliases:
          - fog-node-eu868
    deploy: *worker-deploy

