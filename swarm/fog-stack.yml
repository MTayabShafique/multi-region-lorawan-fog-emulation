      <<: *emqx-deploy
      placement:
        constraints:
          - node.labels.sensiot_emqx_slot == 3
      endpoint_mode: dnsrr

  fog-haproxy:
    image: haproxy:2.6
    configs:
      - source: fog_haproxy_config
        target: /usr/local/etc/haproxy/haproxy.cfg
    networks:
      sensiot_edge:
        aliases:
          - fog-haproxy
    ports:
      - target: 8883
        published: 2883
        protocol: tcp
        mode: host
      - target: 18083
        published: 18084
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /var/lib/haproxy
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.sensiot_ingress == true
        max_replicas_per_node: 1
        preferences:
          - spread: node.hostname
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        monitor: 30s
        failure_action: rollback
        order: stop-first
      resources:
        reservations:
          memory: 32M
        limits:
          cpus: "0.50"
          memory: 128M

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      SERVICES: "1"
      POST: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - autoscaler_control
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.platform.os == linux
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        failure_action: rollback
        order: stop-first
      resources:
        reservations:
          memory: 16M
        limits:
          cpus: "0.25"
          memory: 64M

  fog-autoscaler:
    image: ${AUTOSCALER_IMAGE:-sensiot/fog-autoscaler:latest}
    environment:
      STACK_NAME: ${STACK_NAME:-sensiot-fog}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      DOCKER_API_URL: http://docker-socket-proxy:2375
      AUTOSCALER_DRY_RUN: ${AUTOSCALER_DRY_RUN:-true}
      EVALUATION_INTERVAL_SECONDS: ${EVALUATION_INTERVAL_SECONDS:-30}
      RATE_WINDOW: ${RATE_WINDOW:-2m}
      MIN_REPLICAS: ${MIN_REPLICAS:-2}
      MAX_REPLICAS: ${MAX_REPLICAS:-8}
      TARGET_MESSAGES_PER_SECOND_PER_REPLICA: ${TARGET_MESSAGES_PER_SECOND_PER_REPLICA:-20}
      BACKLOG_SCALE_UP_THRESHOLD: ${BACKLOG_SCALE_UP_THRESHOLD:-10}
      SCALE_UP_PERIODS: ${SCALE_UP_PERIODS:-2}
      SCALE_DOWN_PERIODS: ${SCALE_DOWN_PERIODS:-5}
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-120}
    networks:
      sensiot_edge:
        aliases:
          - fog-autoscaler
      autoscaler_control:
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        monitor: 30s
