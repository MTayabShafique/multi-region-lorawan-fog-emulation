  fog-redis1:
    image: redis:7.4-alpine
    user: "999:1000"
    entrypoint: ["/bin/sh", "/opt/sensiot/redis-entrypoint.sh"]
    environment:
      REDIS_INITIAL_ROLE: master
      REDIS_ANNOUNCE_HOST: fog-redis1
    configs:
      - source: fog_redis_entrypoint
        target: /opt/sensiot/redis-entrypoint.sh
    secrets:
      - source: fog_redis_password
        target: redis_password
    volumes:
      - fog_state_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sensiot_edge
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.sensiot_redis_slot == 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        failure_action: rollback
        order: stop-first
      resources:
        reservations:
          memory: 128M
        limits:
          cpus: "1.00"
          memory: 512M
      endpoint_mode: dnsrr

