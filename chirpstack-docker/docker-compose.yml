volumes:
  postgresqldata:
  redisdata:
  influxdb_data:
  emqx1_data:
  emqx2_data:
  emqx3_data:

services:
  #############################################################################
  #                           Load Balancer (HAProxy)                         #
  #############################################################################
  haproxy:
    image: haproxy:2.6
    restart: always
    networks:
      lorawan:
        aliases:
          - chirpstack-haproxy
    volumes:
      - ./configuration/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8883:8883"
    read_only: true
    tmpfs:
      - /var/lib/haproxy
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3

  #############################################################################
  #                           EMQX MQTT CLUSTER                               #
  #############################################################################
  emqx1:
    image: emqx:5.0
    restart: always
    networks:
      - lorawan
    hostname: emqx@emqx1.chirpstack-docker_lorawan
    volumes:
      - emqx1_data:/opt/emqx/data
      - ./configuration/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./configuration/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ../tls/generated/ca/ca.crt:/opt/emqx/etc/certs/ca.crt:ro
      - ../tls/generated/chirpstack-server/chirpstack-server.crt:/opt/emqx/etc/certs/server.crt:ro
      - ../tls/generated/chirpstack-server/chirpstack-server.key:/opt/emqx/etc/certs/server.key:ro
      - ../tls/generated/chirpstack-bridge/chirpstack-bridge.crt:/opt/emqx/etc/certs/bridge-client.crt:ro
      - ../tls/generated/chirpstack-bridge/chirpstack-bridge.key:/opt/emqx/etc/certs/bridge-client.key:ro
    environment:
      - EMQX_NODE_NAME=emqx@emqx1.chirpstack-docker_lorawan
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_NODE__COOKIE=${CHIRPSTACK_EMQX_COOKIE:?run setup-security.ps1 first}
      - EMQX_CLUSTER__STATIC__SEEDS=emqx@emqx1.chirpstack-docker_lorawan,emqx@emqx2.chirpstack-docker_lorawan,emqx@emqx3.chirpstack-docker_lorawan
      - EMQX_ALLOW_ANONYMOUS=false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18083:18083"
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 5s
      timeout: 25s
      retries: 5

  emqx2:
    image: emqx:5.0
    restart: always
    networks:
      - lorawan
    hostname: emqx@emqx2.chirpstack-docker_lorawan
    volumes:
      - emqx2_data:/opt/emqx/data
      - ./configuration/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./configuration/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ../tls/generated/ca/ca.crt:/opt/emqx/etc/certs/ca.crt:ro
      - ../tls/generated/chirpstack-server/chirpstack-server.crt:/opt/emqx/etc/certs/server.crt:ro
      - ../tls/generated/chirpstack-server/chirpstack-server.key:/opt/emqx/etc/certs/server.key:ro
      - ../tls/generated/chirpstack-bridge/chirpstack-bridge.crt:/opt/emqx/etc/certs/bridge-client.crt:ro
      - ../tls/generated/chirpstack-bridge/chirpstack-bridge.key:/opt/emqx/etc/certs/bridge-client.key:ro
    environment:
      - EMQX_NODE_NAME=emqx@emqx2.chirpstack-docker_lorawan
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_NODE__COOKIE=${CHIRPSTACK_EMQX_COOKIE:?run setup-security.ps1 first}
      - EMQX_CLUSTER__STATIC__SEEDS=emqx@emqx1.chirpstack-docker_lorawan,emqx@emqx2.chirpstack-docker_lorawan,emqx@emqx3.chirpstack-docker_lorawan
      - EMQX_ALLOW_ANONYMOUS=false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 5s
      timeout: 25s
      retries: 5

  emqx3:
    image: emqx:5.0
    restart: always
    networks:
      - lorawan
    hostname: emqx@emqx3.chirpstack-docker_lorawan
    volumes:
      - emqx3_data:/opt/emqx/data
      - ./configuration/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./configuration/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ../tls/generated/ca/ca.crt:/opt/emqx/etc/certs/ca.crt:ro
      - ../tls/generated/chirpstack-server/chirpstack-server.crt:/opt/emqx/etc/certs/server.crt:ro
      - ../tls/generated/chirpstack-server/chirpstack-server.key:/opt/emqx/etc/certs/server.key:ro
      - ../tls/generated/chirpstack-bridge/chirpstack-bridge.crt:/opt/emqx/etc/certs/bridge-client.crt:ro
      - ../tls/generated/chirpstack-bridge/chirpstack-bridge.key:/opt/emqx/etc/certs/bridge-client.key:ro
    environment:
      - EMQX_NODE_NAME=emqx@emqx3.chirpstack-docker_lorawan
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_NODE__COOKIE=${CHIRPSTACK_EMQX_COOKIE:?run setup-security.ps1 first}
      - EMQX_CLUSTER__STATIC__SEEDS=emqx@emqx1.chirpstack-docker_lorawan,emqx@emqx2.chirpstack-docker_lorawan,emqx@emqx3.chirpstack-docker_lorawan
      - EMQX_ALLOW_ANONYMOUS=false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 5s
      timeout: 25s
      retries: 5

  #############################################################################
  #                            PostgreSQL                                     #
  #############################################################################
  postgres:
    image: postgres:14-alpine
    restart: always
    networks:
      - lorawan
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?run setup-security.ps1 first}
      - POSTGRES_DB=chirpstack
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chirpstack"]
      interval: 10s
      timeout: 5s
      retries: 5

  #############################################################################
  #                            Redis                                          #
  #############################################################################
  redis:
    image: redis:7-alpine
    user: "999:1000"
    restart: always
    networks:
      - lorawan
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  #############################################################################
  #                           ChirpStack Core                                 #
  #############################################################################
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: always
    networks:
      - lorawan
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
      - ./wait-for-haproxy.sh:/app/wait-for-haproxy.sh
      - ../tls/generated/ca/ca.crt:/etc/chirpstack/mqtt-certs/ca.crt:ro
      - ../tls/generated/chirpstack-core/chirpstack-core.crt:/etc/chirpstack/mqtt-certs/client.crt:ro
      - ../tls/generated/chirpstack-core/chirpstack-core.key:/etc/chirpstack/mqtt-certs/client.key:ro
    depends_on:
      - postgres
      - redis
      - haproxy
    environment:
      - MQTT_BROKER_HOST=chirpstack-haproxy
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:?run setup-security.ps1 first}
      - CHIRPSTACK_API_SECRET=${CHIRPSTACK_API_SECRET:?run setup-security.ps1 first}
      - CHIRPSTACK_MQTT_USERNAME=chirpstack-core
      - CHIRPSTACK_MQTT_PASSWORD=${CHIRPSTACK_MQTT_PASSWORD:?run setup-security.ps1 first}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  #############################################################################
  #                   Gateway Bridges for Multiple Regions                    #
  #############################################################################
  chirpstack-gateway-bridge-eu868:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: always
    networks:
      - lorawan
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge/chirpstack-gateway-bridge-eu868.toml:/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml
      - ../tls/generated/ca/ca.crt:/etc/chirpstack-gateway-bridge/mqtt-certs/ca.crt:ro
      - ../tls/generated/gateway-bridge/gateway-bridge.crt:/etc/chirpstack-gateway-bridge/mqtt-certs/client.crt:ro
      - ../tls/generated/gateway-bridge/gateway-bridge.key:/etc/chirpstack-gateway-bridge/mqtt-certs/client.key:ro
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=gateway-bridge
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${GATEWAY_MQTT_PASSWORD:?run setup-security.ps1 first}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9109/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  chirpstack-gateway-bridge-us915:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: always
    networks:
      - lorawan
    ports:
      - "1701:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge/chirpstack-gateway-bridge-us915_0.toml:/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml
      - ../tls/generated/ca/ca.crt:/etc/chirpstack-gateway-bridge/mqtt-certs/ca.crt:ro
      - ../tls/generated/gateway-bridge/gateway-bridge.crt:/etc/chirpstack-gateway-bridge/mqtt-certs/client.crt:ro
      - ../tls/generated/gateway-bridge/gateway-bridge.key:/etc/chirpstack-gateway-bridge/mqtt-certs/client.key:ro
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=gateway-bridge
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${GATEWAY_MQTT_PASSWORD:?run setup-security.ps1 first}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9113/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  chirpstack-gateway-bridge-in865:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: always
    networks:
      - lorawan
    ports:
      - "1703:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge/chirpstack-gateway-bridge-in865.toml:/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml
      - ../tls/generated/ca/ca.crt:/etc/chirpstack-gateway-bridge/mqtt-certs/ca.crt:ro
      - ../tls/generated/gateway-bridge/gateway-bridge.crt:/etc/chirpstack-gateway-bridge/mqtt-certs/client.crt:ro
      - ../tls/generated/gateway-bridge/gateway-bridge.key:/etc/chirpstack-gateway-bridge/mqtt-certs/client.key:ro
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=gateway-bridge
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${GATEWAY_MQTT_PASSWORD:?run setup-security.ps1 first}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9110/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  chirpstack-gateway-bridge-ru864:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: always
    networks:
      - lorawan
    ports:
      - "1704:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge/chirpstack-gateway-bridge-ru864.toml:/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml
      - ../tls/generated/ca/ca.crt:/etc/chirpstack-gateway-bridge/mqtt-certs/ca.crt:ro
      - ../tls/generated/gateway-bridge/gateway-bridge.crt:/etc/chirpstack-gateway-bridge/mqtt-certs/client.crt:ro
      - ../tls/generated/gateway-bridge/gateway-bridge.key:/etc/chirpstack-gateway-bridge/mqtt-certs/client.key:ro
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=gateway-bridge
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${GATEWAY_MQTT_PASSWORD:?run setup-security.ps1 first}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9112/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  #############################################################################
  #                           ChirpStack REST API                             #
  #############################################################################
  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: always
    networks:
      - lorawan
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - chirpstack
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8090/"]
      interval: 30s
      timeout: 10s
      retries: 3

  #############################################################################
  #                         InfluxDB (for metrics)                            #
  #############################################################################
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    networks:
      - lorawan
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "127.0.0.1:8087:8087"
    restart: always
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${LORAWAN_INFLUX_USERNAME:?run setup-security.ps1 first}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${LORAWAN_INFLUX_PASSWORD:?run setup-security.ps1 first}
      - DOCKER_INFLUXDB_INIT_ORG=lorawan_org
      - DOCKER_INFLUXDB_INIT_BUCKET=lorawan_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${LORAWAN_INFLUX_TOKEN:?run setup-security.ps1 first}
      - INFLUXD_HTTP_BIND_ADDRESS=:8087

  #############################################################################
  #   Automated Metrics Container (Python scripts + Dockerfile in subfolder)  #
  #############################################################################
  automated-metrics:
    build: automated_metrics
    container_name: automated_metrics_container
    restart: always
    depends_on:
      - haproxy
      - influxdb
    networks:
      - lorawan
    environment:
      - MQTT_BROKER=chirpstack-haproxy
      - MQTT_PORT=8883
      - MQTT_TOPIC=application/+/device/+/event/up
      - MQTT_USERNAME=automated-metrics
      - MQTT_PASSWORD=${METRICS_MQTT_PASSWORD:?run setup-security.ps1 first}
      - MQTT_TLS_ENABLED=true
      - MQTT_TLS_CA=/run/mqtt-certs/ca.crt
      - MQTT_TLS_CERT=/run/mqtt-certs/client.crt
      - MQTT_TLS_KEY=/run/mqtt-certs/client.key
      - INFLUX_URL=http://influxdb:8087
      - INFLUX_TOKEN=${LORAWAN_INFLUX_TOKEN:?run setup-security.ps1 first}
      - INFLUX_ORG=lorawan_org
      - INFLUX_BUCKET=lorawan_bucket
    volumes:
      - ../tls/generated/ca/ca.crt:/run/mqtt-certs/ca.crt:ro
      - ../tls/generated/automated-metrics/automated-metrics.crt:/run/mqtt-certs/client.crt:ro
      - ../tls/generated/automated-metrics/automated-metrics.key:/run/mqtt-certs/client.key:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,sys; sys.exit(0 if b'python' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  lorawan:
    driver: bridge
