

# MQTT client configuration for gateway bridge
[integration.mqtt.auth.generic]
# Use the HAProxy service name (as defined in docker-compose) as the broker host
servers = ["ssl://chirpstack-haproxy:8883"]
username = "$GATEWAY_MQTT_USERNAME"
password = "$GATEWAY_MQTT_PASSWORD"
ca_cert = "/etc/chirpstack-gateway-bridge/mqtt-certs/ca.crt"
tls_cert = "/etc/chirpstack-gateway-bridge/mqtt-certs/client.crt"
tls_key = "/etc/chirpstack-gateway-bridge/mqtt-certs/client.key"

[integration.mqtt]
# Set topic templates using a region-specific prefix
event_topic_template = "eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
state_topic_template = "eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
command_topic_template = "eu868/gateway/{{ .GatewayID }}/command/#"
json = true

[metrics.prometheus]
# Enable Prometheus metrics endpoint
endpoint_enabled=true

# Define the port for metrics
bind="0.0.0.0:9109"
