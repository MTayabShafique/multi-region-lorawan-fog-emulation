apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8087
    jsonData:
      version: Flux
      organization: "lorawan_org"
      defaultBucket: "lorawan_bucket"
      tlsSkipVerify: true
      httpMode: POST
    secureJsonData:
      token: $LORAWAN_INFLUX_TOKEN
