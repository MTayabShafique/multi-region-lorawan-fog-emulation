networks:
  chirpstack-docker_lorawan:
    external: true
  fog-nodes_fog_network:
    external: true
  the-sensiot-framework_backend:
    external: true

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_monitor
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - chirpstack-docker_lorawan
      - fog-nodes_fog_network
      - the-sensiot-framework_backend
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - chirpstack-docker_lorawan
      - fog-nodes_fog_network
      - the-sensiot-framework_backend
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    networks:
      - chirpstack-docker_lorawan
      - fog-nodes_fog_network
      - the-sensiot-framework_backend
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - ./grafana-provisioning/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-provisioning/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/provisioning/config:/etc/grafana/provisioning/config
      - ./grafana-provisioning/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?run setup-security.ps1 first}
      - LORAWAN_INFLUX_TOKEN=${LORAWAN_INFLUX_TOKEN:?run setup-security.ps1 first}
      - SENSIOT_INFLUX_TOKEN=${SENSIOT_INFLUX_TOKEN:?run setup-security.ps1 first}
    networks:
      - chirpstack-docker_lorawan
      - fog-nodes_fog_network
      - the-sensiot-framework_backend
