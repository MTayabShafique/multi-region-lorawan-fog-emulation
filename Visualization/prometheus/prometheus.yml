global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- ChirpStack Core ---
  - job_name: 'chirpstack_core'
    static_configs:
      - targets: ['chirpstack:9108']

  # --- Gateway Bridges ---
  - job_name: 'chirpstack_gateway_bridge_eu868'
    static_configs:
      - targets: ['chirpstack-gateway-bridge-eu868:9109']

  - job_name: 'chirpstack_gateway_bridge_us915'
    static_configs:
      - targets: ['chirpstack-gateway-bridge-us915:9113']

  - job_name: 'chirpstack_gateway_bridge_in865'
    static_configs:
      - targets: ['chirpstack-gateway-bridge-in865:9110']

  - job_name: 'chirpstack_gateway_bridge_ru864'
    static_configs:
      - targets: ['chirpstack-gateway-bridge-ru864:9112']

  # --- cAdvisor (Container-Level Metrics) ---
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']  # cAdvisor container name:port

  # --- Node Exporter (System-Level Metrics) ---
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']  # Node Exporter container name:port

  # --- EMQX Node 1 ---
  - job_name: 'emqx1_stats'
    static_configs:
      - targets: ['emqx1:18083']
    metrics_path: '/api/v5/prometheus/stats'
    scheme: 'http'

  # --- EMQX Node 2 ---
  - job_name: 'emqx2_stats'
    static_configs:
      - targets: ['emqx2:18083']
    metrics_path: '/api/v5/prometheus/stats'
    scheme: 'http'

  # --- EMQX Node 3 ---
  - job_name: 'emqx3_stats'
    static_configs:
      - targets: ['emqx3:18083']
    metrics_path: '/api/v5/prometheus/stats'
    scheme: 'http'

  - job_name: 'fog_nodes'
    scrape_interval: 1s
    dns_sd_configs:
      - names:
          - 'fog-node-us915'
          - 'fog-node-eu868'
          - 'fog-node-ru864'
          - 'fog-node-in865'
        type: A
        port: 8000
        refresh_interval: 15s

  - job_name: 'sensiot_writer'
    scrape_interval: 1s
    static_configs:
      - targets: ['prometheus_writer:8000']

  - job_name: 'sensiot_memcached'
    static_configs:
      - targets: ['memcached_exporter:9150']
